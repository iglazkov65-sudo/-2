<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відгуки: «Тигролови» та «Бояриня»</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #3498db;
            background: #ffffff;
            color: #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #3498db;
            color: #ffffff;
        }
        .work-info {
            background: #eef7fc;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }
        .work-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .work-author {
            color: #7f8c8d;
            font-style: italic;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #27ae60;
        }
        .reviews-section {
            margin-top: 30px;
        }
        .reviews-title {
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .review-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .reviewer-name {
            font-weight: bold;
            color: #2c3e50;
        }
        .stars {
            color: #f1c40f;
        }
        .review-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .like-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s, background 0.2s;
        }
        .like-btn:hover:not(:disabled) {
            background: #c0392b;
            transform: scale(1.05);
        }
        .like-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .empty-msg {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Читацькі відгуки</h1>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tigrolovy" onclick="switchWork('tigrolovy')">1. Іван Багряний — «Тигролови»</button>
        <button class="tab-btn" id="btn-boyarynya" onclick="switchWork('boyarynya')">2. Леся Українка — «Бояриня»</button>
    </div>

    <div class="work-info">
        <div class="work-title" id="current-title">Іван Багряний — «Тигролови»</div>
        <div class="work-author" id="current-desc">Пригодницький роман про волю, честь та виживання в тайзі.</div>
    </div>

    <form id="review-form" onsubmit="addReview(event)">
        <div class="form-group">
            <label for="name">Ваше ім'я або псевдонім:</label>
            <input type="text" id="name" required placeholder="Введіть ваше ім'я">
        </div>
        <div class="form-group">
            <label for="rating">Ваша оцінка:</label>
            <select id="rating">
                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                <option value="3">⭐⭐⭐ (3/5)</option>
                <option value="2">⭐⭐ (2/5)</option>
                <option value="1">⭐ (1/5)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="comment">Ваш відгук:</label>
            <textarea id="comment" required placeholder="Напишіть ваші враження від твору..."></textarea>
        </div>
        <button type="submit" class="submit-btn" id="submit-btn">Опублікувати відгук</button>
    </form>

    <div class="reviews-section">
        <div class="reviews-title">Відгуки учнів:</div>
        <div id="reviews-list">Завантаження відгуків з хмари...</div>
    </div>
</div>

<script>
    // Ваша ссылка на npoint.io (убедитесь, что она здесь прописана правильно без буквы T)
    const API_URL = "https://api.npoint.io/b509c05c5eb85c408620";

    let currentWork = 'tigrolovy';

    const worksData = {
        tigrolovy: {
            title: "Іван Багряний — «Тигролови»",
            desc: "Пригодницький роман про волю, честь та виживання в тайзі."
        },
        boyarynya: {
            title: "Леся Українка — «Бояриня»",
            desc: "Драматична поема про долю України, патріотизм та вибір."
        }
    };

    function getLikedPosts() {
        return JSON.parse(localStorage.getItem('liked_reviews') || '[]');
    }

    function saveLikedPost(id) {
        const liked = getLikedPosts();
        if (!liked.includes(id)) {
            liked.push(id);
            localStorage.setItem('liked_reviews', JSON.stringify(liked));
        }
    }

    async function loadReviews() {
        const listContainer = document.getElementById('reviews-list');
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            // Защита, если в облаке пусто или нет нужного раздела
            const reviews = (data && data[currentWork]) ? data[currentWork] : [];
            const likedList = getLikedPosts();

            if (reviews.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">Поки немає відгуків для цього твору. Будьте першим!</div>';
                return;
            }

            listContainer.innerHTML = reviews.map(r => {
                const isLiked = likedList.includes(r.id);
                return `
                    <div class="review-card">
                        <div class="review-header">
                            <span class="reviewer-name">${escapeHtml(r.name || 'Анонім')}</span>
                            <span class="stars">${'★'.repeat(r.rating || 5)}${'☆'.repeat(5 - (r.rating || 5))}</span>
                        </div>
                        <div>${escapeHtml(r.comment || '')}</div>
                        <div class="review-footer">
                            <button class="like-btn" ${isLiked ? 'disabled' : ''} onclick="likeReview('${r.id}')">
                                ❤️ ${r.likes || 0} ${isLiked ? '(Ви вже лайкнули)' : ''}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        } catch (e) {
            listContainer.innerHTML = '<div class="empty-msg" style="color: red;">Помилка завантаження. Спробуйте оновити сторінку.</div>';
        }
    }

    window.switchWork = function(work) {
        currentWork = work;
        document.getElementById('btn-tigrolovy').classList.toggle('active', work === 'tigrolovy');
        document.getElementById('btn-boyarynya').classList.toggle('active', work === 'boyarynya');
        
        document.getElementById('current-title').textContent = worksData[work].title;
        document.getElementById('current-desc').textContent = worksData[work].desc;

        loadReviews();
    };

    window.addReview = async function(event) {
        event.preventDefault();
        const name = document.getElementById('name').value.trim();
        const rating = parseInt(document.getElementById('rating').value);
        const comment = document.getElementById('comment').value.trim();

        if (!name || !comment) return;

        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = "Публікація...";

        try {
            const res = await fetch(API_URL);
            let data = await res.json();
            
            if (!data) data = {};
            if (!data.tigrolovy) data.tigrolovy = [];
            if (!data.boyarynya) data.boyarynya = [];

            const newReview = {
                id: 'rev_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                name: name,
                rating: rating,
                comment: comment,
                likes: 0,
                date: new Date().toISOString()
            };

            // Добавляем отзыв именно в массив текущего произведения
            data[currentWork].unshift(newReview);

            await fetch(API_URL, {
                method: 'PUT', // Используем PUT для полной надежной перезаписи структуры в npoint
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('comment').value = '';
            await loadReviews();
        } catch (e) {
            alert('Помилка при публікації. Спробуйте ще раз.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Опублікувати відгук";
        }
    };

    window.likeReview = async function(id) {
        const likedList = getLikedPosts();
        if (likedList.includes(id)) return;

        try {
            const res = await fetch(API_URL);
            let data = await res.json();
            
            if (!data) data = {};
            if (!data[currentWork]) data[currentWork] = [];
            
            const target = data[currentWork].find(r => r.id === id);
            if (target) {
                target.likes = (target.likes || 0) + 1;
                saveLikedPost(id);

                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                await loadReviews();
            }
        } catch (e) {
            console.error(e);
        }
    };

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    // Первоначальная загрузка
    loadReviews();
    
    // Автообновление каждые 4 секунды (чтобы у всех учнів и у вас в реальном времени подтягивались новые записи)
    setInterval(loadReviews, 4000);
</script>

</body>
</html>
