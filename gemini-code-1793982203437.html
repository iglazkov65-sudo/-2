<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відгуки: «Тигролови» та «Бояриня»</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #3498db;
            background: #ffffff;
            color: #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #3498db;
            color: #ffffff;
        }
        .work-info {
            background: #eef7fc;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }
        .work-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .work-author {
            color: #7f8c8d;
            font-style: italic;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .submit-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background: #27ae60;
        }
        .reviews-section {
            margin-top: 30px;
        }
        .reviews-title {
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .review-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .reviewer-name {
            font-weight: bold;
            color: #2c3e50;
        }
        .stars {
            color: #f1c40f;
        }
        .review-footer {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .like-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s, background 0.2s;
        }
        .like-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
        .empty-msg {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Читацькі відгуки</h1>

    <div class="tabs">
        <button class="tab-btn active" id="btn-tigrolovy" onclick="switchWork('tigrolovy')">1. Іван Багряний — «Тигролови»</button>
        <button class="tab-btn" id="btn-boyarynya" onclick="switchWork('boyarynya')">2. Леся Українка — «Бояриня»</button>
    </div>

    <div class="work-info">
        <div class="work-title" id="current-title">Іван Багряний — «Тигролови»</div>
        <div class="work-author" id="current-desc">Пригодницький роман про волю, честь та виживання в тайзі.</div>
    </div>

    <form id="review-form" onsubmit="addReview(event)">
        <div class="form-group">
            <label for="name">Ваше ім'я або псевдонім:</label>
            <input type="text" id="name" required placeholder="Введіть ваше ім'я">
        </div>
        <div class="form-group">
            <label for="rating">Ваша оцінка:</label>
            <select id="rating">
                <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
                <option value="4">⭐⭐⭐⭐ (4/5)</option>
                <option value="3">⭐⭐⭐ (3/5)</option>
                <option value="2">⭐⭐ (2/5)</option>
                <option value="1">⭐ (1/5)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="comment">Ваш відгук:</label>
            <textarea id="comment" required placeholder="Напишіть ваші враження від твору..."></textarea>
        </div>
        <button type="submit" class="submit-btn">Опублікувати відгук</button>
    </form>

    <div class="reviews-section">
        <div class="reviews-title">Відгуки учнів:</div>
        <div id="reviews-list"></div>
    </div>
</div>

<script>
    let currentWork = 'tigrolovy';

    const worksData = {
        tigrolovy: {
            title: "Іван Багряний — «Тигролови»",
            desc: "Пригодницький роман про волю, честь та виживання в тайзі."
        },
        boyarynya: {
            title: "Леся Українка — «Бояриня»",
            desc: "Драматична поема про долю України, патріотизм та вибір."
        }
    };

    function loadReviews() {
        const stored = localStorage.getItem('reviews_' + currentWork);
        const reviews = stored ? JSON.parse(stored) : [];
        const listContainer = document.getElementById('reviews-list');

        if (reviews.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">Поки немає відгуків. Будьте першим, хто залишить свій відгук!</div>';
            return;
        }

        listContainer.innerHTML = reviews.map((r, index) => `
            <div class="review-card">
                <div class="review-header">
                    <span class="reviewer-name">${escapeHtml(r.name)}</span>
                    <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                </div>
                <div>${escapeHtml(r.comment)}</div>
                <div class="review-footer">
                    <button class="like-btn" onclick="likeReview(${index})">
                        ❤️ ${r.likes || 0}
                    </button>
                </div>
            </div>
        `).join('');
    }

    function switchWork(work) {
        currentWork = work;
        document.getElementById('btn-tigrolovy').classList.toggle('active', work === 'tigrolovy');
        document.getElementById('btn-boyarynya').classList.toggle('active', work === 'boyarynya');
        
        document.getElementById('current-title').textContent = worksData[work].title;
        document.getElementById('current-desc').textContent = worksData[work].desc;

        loadReviews();
    }

    function addReview(event) {
        event.preventDefault();
        const name = document.getElementById('name').value.trim();
        const rating = parseInt(document.getElementById('rating').value);
        const comment = document.getElementById('comment').value.trim();

        if (!name || !comment) return;

        const stored = localStorage.getItem('reviews_' + currentWork);
        const reviews = stored ? JSON.parse(stored) : [];
        
        reviews.unshift({ name, rating, comment, likes: 0, date: new Date().toISOString() });
        localStorage.setItem('reviews_' + currentWork, JSON.stringify(reviews));

        document.getElementById('comment').value = '';
        loadReviews();
    }

    function likeReview(index) {
        const stored = localStorage.getItem('reviews_' + currentWork);
        const reviews = stored ? JSON.parse(stored) : [];
        
        if (reviews[index]) {
            reviews[index].likes = (reviews[index].likes || 0) + 1;
            localStorage.setItem('reviews_' + currentWork, JSON.stringify(reviews));
            loadReviews();
        }
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
        });
    }

    loadReviews();
</script>

</body>
</html>
